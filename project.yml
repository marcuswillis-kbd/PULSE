name: PULSE
options:
  bundleIdPrefix: com.pulsebreath.local
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  PULSE:
    type: application
    platform: iOS
    sources: [Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsebreath.local.PULSE
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: PULSEWatch
        embed: true
  PULSEWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsebreath.local.PULSE.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.pulsebreath.local.PULSE
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: PULSE uses heart rate while you follow the breathing guide.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: PULSE starts a temporary breathing workout to read your heart rate.
        CODE_SIGN_ENTITLEMENTS: Watch/PULSEWatch.entitlements
