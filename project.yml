name: PULSE
options:
  bundleIdPrefix: com.pulsebreath.local
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  PULSE:
    type: application
    platform: iOS
    sources:
      - path: Phone
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
      - path: Shared
    # No `info:` key. XcodeGen writePlists() replaces info.path with a
    # default template (bundle id, name, versions 1.0 and 1, package type)
    # and deletes every other key. CI runs `xcodegen generate` before the
    # archive, so that template is what Xcode compiles. Xcode then injects
    # CFBundleSupportedPlatforms, DTPlatformName, MinimumOSVersion, and
    # UIDeviceFamily, which is why those showed up in the IPA while
    # LSRequiresIPhoneOS did not. Phone/Info.plist is the file that ships.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsebreath.local.PULSE
        INFOPLIST_FILE: Phone/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Phone/PULSE.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # type: application (not application.watchapp2) is the single-target
      # watchOS 10 product. watchapp2 duplicates the executable and fails
      # with "Multiple commands produce". link stays false so the Watch app
      # is embedded, not linked as a library. XcodeGen copies it to
      # PULSE.app/Watch (dstSubfolderSpec 16). PlugIns is for appex
      # extensions; altool cannot decide a platform when this APPL bundle
      # is there. The TestFlight workflow runs Scripts/patch_watch_embed.py
      # to keep that Watch destination and add CodeSignOnCopy.
      - target: PULSEWatch
        embed: true
        link: false
  PULSEWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
      - path: Shared
    # Same as the iPhone target: do not set `info:`. A regenerated Watch
    # plist drops WKApplication and WKCompanionAppBundleIdentifier, which
    # App Store Connect rejects on a companion watchOS app. Watch/Info.plist
    # keeps WKApplication true and WKCompanionAppBundleIdentifier
    # com.pulsebreath.local.PULSE.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsebreath.local.PULSE.watchkitapp
        PRODUCT_NAME: PULSEWatch
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: Watch/PULSEWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
