name: PULSE
options:
  bundleIdPrefix: com.pulsebreath.local
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  PULSE:
    type: application
    platform: iOS
    sources:
      - path: Phone
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    info:
      path: Phone/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsebreath.local.PULSE
        # Explicit Info.plist so CFBundleSupportedPlatforms stays an array
        # of one string. A generated plist can leave altool unable to decide
        # the platform (error 19) even when the value prints as iPhoneOS.
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Phone/PULSE.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # type: application (not application.watchapp2) is the single-target
      # watchOS 10 product. watchapp2 duplicates the executable and fails
      # with "Multiple commands produce". link stays false so the Watch app
      # is embedded, not linked as a library. CodeSignOnCopy is applied by
      # Scripts/patch_watch_embed.py during the TestFlight workflow only;
      # the unsigned compile test keeps the embed phase that already built.
      - target: PULSEWatch
        embed: true
        link: false
  PULSEWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    info:
      path: Watch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsebreath.local.PULSE.watchkitapp
        PRODUCT_NAME: PULSEWatch
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: Watch/PULSEWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
