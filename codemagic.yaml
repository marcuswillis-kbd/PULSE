workflows:
  pulse-ios-watch:
    name: PULSE iPhone + Apple Watch (unsigned compile test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Compile for iPhone simulator
        script: |
          xcodebuild -project PULSE.xcodeproj -scheme PULSE -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # Signed archive for TestFlight.
  #
  # distribution_type is app_store (CLI type IOS_APP_STORE) for both:
  #   com.pulsebreath.local.PULSE
  #   com.pulsebreath.local.PULSE.watchkitapp
  #
  # ios_signing fetches the Apple Distribution certificate by its Codemagic
  # reference name. It does not set distribution_type + bundle_identifier:
  # that form only downloads provisioning profiles already stored in
  # Codemagic Code signing identities, and aborts with
  # "No matching profiles found" before a script can create them.
  # Scripts/ci_testflight_profiles.py creates one App Store profile per
  # bundle id through the PULSE ASC integration, then use-profiles applies
  # both. No CERTIFICATE_PRIVATE_KEY and no variable group are required.
  pulse-testflight:
    name: PULSE TestFlight (signed iPhone + Watch)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: PULSE ASC
    environment:
      xcode: latest
      ios_signing:
        certificates:
          - certificate: pulse_distribution
            environment_variable: PULSE_DISTRIBUTION_CERTIFICATE
      vars:
        BUNDLE_ID: com.pulsebreath.local.PULSE
        WATCH_BUNDLE_ID: com.pulsebreath.local.PULSE.watchkitapp
        XCODE_SCHEME: PULSE
        APP_STORE_APPLE_ID: "6826766285"
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Embed the Watch app for Xcode 26
        script: python3 Scripts/patch_watch_embed.py PULSE.xcodeproj/project.pbxproj
      - name: Create App Store profiles for iPhone and Watch
        script: python3 Scripts/ci_testflight_profiles.py
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Increment build number from TestFlight
        script: bash Scripts/ci_testflight_version.sh
      - name: Archive and export IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/PULSE.xcodeproj" \
            --scheme "$XCODE_SCHEME"
      - name: Verify the Watch app is inside the IPA
        script: bash Scripts/ci_verify_ipa.sh
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
